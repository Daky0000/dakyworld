<!doctype html>
<!--
  The social share image, assets/brand/og-share.png (1200 x 630), in the v21
  design system (docs/DESIGN-SYSTEM.md). Render it with headless Chrome from the
  repo root, served over HTTP so the font and logo load:

    "C:/Program Files/Google/Chrome/Application/chrome.exe" --headless=new \
      --window-size=1200,630 --hide-scrollbars --virtual-time-budget=4000 \
      --screenshot=assets/brand/og-share.png http://127.0.0.1:<port>/scripts/og-share.html

  The copy is the live homepage's. Never put a claim here the site does not make.
-->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/assets/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#ECEEF1;font-family:"Outfit",sans-serif;color:#0D1526;padding:18px}
.panel{position:relative;height:100%;border-radius:22px;overflow:hidden;padding:64px 72px;
  background:radial-gradient(700px 420px at 15% 20%,#fff 35%,rgba(255,255,255,0) 100%),linear-gradient(180deg,#FBFCFE,#F3F6FA)}
.dots{position:absolute;right:-40px;top:-30px;width:560px;height:440px;
  background-image:radial-gradient(circle,#BFCADB 1.6px,transparent 2.1px);background-size:15px 15px;
  -webkit-mask:radial-gradient(38% 30% at 30% 40%,#000 60%,transparent 100%),radial-gradient(30% 26% at 70% 62%,#000 55%,transparent 100%),radial-gradient(22% 20% at 55% 20%,#000 50%,transparent 100%);transform:scaleX(-1)}
img{height:52px;width:auto;position:relative}
.cap{position:relative;margin-top:62px;font-size:17px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#5B6374}
h1{position:relative;margin-top:18px;font-weight:400;font-size:76px;line-height:1.02;letter-spacing:-.04em;max-width:15ch}
h1 span{color:#5B6374}
.foot{position:absolute;left:72px;right:72px;bottom:52px;display:flex;justify-content:space-between;font-size:20px;color:#5B6374}
.foot b{font-weight:500;color:#2563EB}
</style></head>
<body><div class="panel"><div class="dots"></div>
<img src="/assets/brand/masters/lockup-color.png" alt="">
<div class="cap">Websites · Automation · Integrations · AI</div>
<h1>Better customer experiences. <span>Less manual work.</span></h1>
<div class="foot"><span>dakyx.com · Kumasi, Ghana</span><b>Serving Ghana &amp; West Africa</b></div>
</div></body></html>
