# The DakyX edge bridge. See README.md before deploying.
name = "dakyx-edge-bridge"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# Every customer hostname reaches this Worker through Cloudflare for SaaS on the
# hosting zone; the admin hostname is how the OS writes to it.
routes = [
  { pattern = "*/*", zone_name = "REPLACE_WITH_HOSTING_DOMAIN" }
]

[vars]
ADMIN_HOST = "bridge-admin.REPLACE_WITH_HOSTING_DOMAIN"

# ADMIN_TOKEN and BYPASS_TOKEN are secrets:
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put BYPASS_TOKEN

[[durable_objects.bindings]]
name = "BRIDGE"
class_name = "SiteBridge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SiteBridge"]
